# .markdownlint-cli2.yaml
#
# Configuration for generated Doxygen Markdown.

config:
  # Start with markdownlint's standard rules.
  default: true

  # MD013 - Line length
  #
  # Doxygen generates long lines containing links, declarations,
  # fully-qualified names, etc. Do not enforce an 80-character limit.
  MD013: false

  # MD024 - Multiple headings with the same content
  #
  # Only flag duplicate headings when they share the same parent heading.
  MD024:
    siblings_only: true

  # MD033 - Inline HTML
  #
  # Doxygen generates explicit anchors and line breaks such as:
  # <a id="a528d5a4c7d75a6951ec236b7b46fcedb"></a>
  # <br>
  #
  # Allow only these HTML elements; other inline HTML remains an error.
  MD033:
    allowed_elements:
      - a
      - br
      - sup

  # MD060 - Table style
  #
  # Doxygen generates tables that may not conform to the default markdownlint
  # table style rules. Use the compact style to reduce unnecessary spacing.
  MD060:
    style: aligned
