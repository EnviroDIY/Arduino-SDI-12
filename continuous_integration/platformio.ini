; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
boards_dir = ${platformio.core_dir}/boards

[workflow_base]
framework = arduino
lib_ldf_mode = deep+
build_flags =
    -Wall
    -Wextra
lib_ignore =
    .git
    .pio
    .vscode
    .history


; ------------------------------------------------------------
;  ARDUINO AVR FAMILY
; ------------------------------------------------------------

[arduino_avr_base]
extends = workflow_base
platform = atmelavr
lib_ignore =
    ${workflow_base.lib_ignore}
    RTCZero
    Adafruit TinyUSB Library
    ESP8266SdFat

; Secondary base for AVR boards that use FAT/SPI/SdFat flags
[arduino_avr_fat_base]
extends = arduino_avr_base
build_flags =
    ${workflow_base.build_flags}
    -D USE_FAT_FILE_FLAG_CONTIGUOUS=0
    -D ENABLE_DEDICATED_SPI=0
    -D SDFAT_FILE_TYPE=1
    -D SD_FAT_TYPE=1
    -D CHECK_FLASH_PROGRAMMING=0
    -D EPOCHTIME_DISABLE_STRFTIME


; --- Simple AVR boards (no FAT flags) ---
[env:mayfly]
extends = arduino_avr_base
board = mayfly

[env:mayfly_external_pcint]
extends = env:mayfly
build_flags =
    ${arduino_avr_fat_base.build_flags}
    -D SDI12_INTERNAL_PCINT

[env:megaatmega2560]
extends = arduino_avr_base
board = megaatmega2560

[env:megaatmega2560_external_pcint]
extends = env:megaatmega2560
build_flags =
    ${arduino_avr_fat_base.build_flags}
    -D SDI12_INTERNAL_PCINT


; --- FAT‑enabled AVR boards (extend the secondary base) ---
[env:uno]
extends = arduino_avr_fat_base
board = uno

[env:uno_external_pcint]
extends = env:uno
build_flags =
    ${arduino_avr_fat_base.build_flags}
    -D SDI12_INTERNAL_PCINT

[env:feather328p]
extends = arduino_avr_fat_base
board = feather328p

[env:feather328p_external_pcint]
extends = env:feather328p
build_flags =
    ${arduino_avr_fat_base.build_flags}
    -D SDI12_INTERNAL_PCINT

[env:leonardo]
extends = arduino_avr_fat_base
board = leonardo

[env:leonardo_external_pcint]
extends = env:leonardo
build_flags =
    ${arduino_avr_fat_base.build_flags}
    -D SDI12_INTERNAL_PCINT

[env:feather32u4]
extends = arduino_avr_fat_base
board = feather32u4

[env:feather32u4_external_pcint]
extends = env:feather32u4
build_flags =
    ${arduino_avr_fat_base.build_flags}
    -D SDI12_INTERNAL_PCINT


; ------------------------------------------------------------
;  ARDUINO SAMD FAMILY
; ------------------------------------------------------------

[arduino_samd_base]
extends = workflow_base
platform = atmelsam
lib_ignore =
    ${workflow_base.lib_ignore}
    SDI-12_ExtInts
    SoftwareSerial_ExtInts
    AltSoftSerial
    NeoSWSerial
    SoftwareWire
    Adafruit TinyUSB Library
    ESP8266SdFat

[env:envirodiy_stonefly_m4]
extends = arduino_samd_base
board = envirodiy_stonefly_m4
board_build.variant = stonefly_m4
board_build.variants_dir = ${platformio.core_dir}/variants
board_build.ldscript = ${platformio.core_dir}/variants/stonefly_m4/linker_scripts/gcc/flash_with_bootloader.ld

[env:zeroUSB]
extends = arduino_samd_base
board = zeroUSB

[env:adafruit_feather_m0]
extends = arduino_samd_base
board = adafruit_feather_m0
lib_ignore =
    ${arduino_samd_base.lib_ignore}
    USBHost

[env:adafruit_feather_m4]
extends = arduino_samd_base
board = adafruit_feather_m4
lib_ignore =
    ${arduino_samd_base.lib_ignore}
    USBHost
    RTCZero


; ------------------------------------------------------------
;  ESPRESSIF 8266 FAMILY
; ------------------------------------------------------------

[esp8266_base]
extends = workflow_base
platform = espressif8266
monitor_filters = esp8266_exception_decoder
lib_ignore =
    ${workflow_base.lib_ignore}
    SDI-12_ExtInts
    SoftwareSerial_ExtInts
    AltSoftSerial
    NeoSWSerial
    SoftwareWire
    RTCZero
    Adafruit TinyUSB Library
    SdFat

[env:huzzah]
extends = esp8266_base
board = huzzah


; ------------------------------------------------------------
;  ESPRESSIF 32 FAMILY
; ------------------------------------------------------------

[esp32_base]
extends = workflow_base
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
monitor_filters = esp32_exception_decoder
lib_ignore =
    ${workflow_base.lib_ignore}
    SDI-12_ExtInts
    SoftwareSerial_ExtInts
    AltSoftSerial
    NeoSWSerial
    SoftwareWire
    RTCZero
    Adafruit TinyUSB Library
    ESP8266SdFat
build_flags =
    ${workflow_base.build_flags}
    -DCONFIG_TOUCH_SUPPRESS_DEPRECATE_WARN=1
    -D IDF_CCACHE_ENABLE=1

[env:arduino_nano_esp32]
extends = esp32_base
board = arduino_nano_esp32

[env:esp32dev]
extends = esp32_base
board = esp32dev

[env:esp32-c3-devkitm-1]
extends = esp32_base
board = esp32-c3-devkitm-1

[env:esp32-c6-devkitm-1]
extends = esp32_base
board = esp32-c6-devkitm-1

[env:esp32-s3-devkitm-1]
extends = esp32_base
board = esp32-s3-devkitm-1


; ------------------------------------------------------------
;  RENESAS FAMILY
; ------------------------------------------------------------

[renesas_base]
extends = workflow_base
platform = renesas-ra
lib_ignore =
    ${workflow_base.lib_ignore}
    SoftwareSerial_ExtInts
    AltSoftSerial
    NeoSWSerial
    SoftwareWire
    RTCZero
    Adafruit TinyUSB Library
    ESP8266SdFat
build_flags =
    ${workflow_base.build_flags}

[env:uno_r4_wifi]
extends = renesas_base
board = uno_r4_wifi
