; PlatformIO Project Configuration File

[platformio]
description = SDI-12 Library Example L: Non-Blocking Concurrent Logger
src_dir = .piolibdeps/Arduino-SDI-12_ID1486/examples/l_non_blocking_concurrent_logger

[env:mayfly]
monitor_speed = 115200
board = mayfly
platform = atmelavr
framework = arduino
lib_ldf_mode = deep+
lib_ignore = RTCZero
lib_deps =
    SDI-12
