; PlatformIO Project Configuration File

[platformio]
description = SDI-12 Library Example G:  SDI-12 Terminal and PC Interface
src_dir = .piolibdeps/Arduino-SDI-12_ID1486/examples/g_terminal_interface

[env:mayfly]
monitor_speed = 115200
board = mayfly
platform = atmelavr
framework = arduino
lib_ldf_mode = deep+
lib_ignore = RTCZero
lib_deps =
    SDI-12
